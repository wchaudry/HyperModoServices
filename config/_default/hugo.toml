baseURL = "https://hypermodo.com/"
title = "HyperModo"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0
buildDrafts = false
buildFuture = false
disableKinds = ["taxonomy", "term"]
relativeURLs = true

[params]
  description = "HyperModo helps companies reach broader markets by building enterprise data systems — and building the internal workforce that runs them, so the expertise stays when the consultants leave."
  email = "wiqar@hypermodo.com"
  linkedin = "https://linkedin.com/in/wiqar"
  location = "New York / Philadelphia"
  entity = "a practice of Xymbia Inc."
  booking = ""

[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[sitemap]
  changefreq = "weekly"
  priority = 0.5
