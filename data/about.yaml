firm:
  heading: "Built to be handed over."
  paras:
    - "HyperModo helps companies make transformation a culture rather than a project: the continuous improvement of people, process, and technology, at scale, so a business serves its customers, enters new markets, and outpaces its competitors."
    - "From the first day, the client's people and ours work as one team, and AI is part of how that team learns, trains, and delivers. We measure ourselves on what is still running after we leave. The capability stays. The team that runs it stays. That is the whole point, and it is what a consultancy doesn't do."
  facts:
    - { k: "Practice", v: "HyperModo, a practice of Xymbia Inc." }
    - { k: "Based", v: "New York and Philadelphia" }
    - { k: "Specialization", v: "Enterprise data systems, and the people and process around them" }
    - { k: "Team", v: "Four people, deliberately" }
