firm:
  heading: "A firm that works itself out of a job."
  paras:
    - "HyperModo helps companies build their own transformation engine: the continuous improvement of people, process and technology, at scale, so a business serves its customers, enters new markets and out-innovates its competitors."
    - "We do it as a venture the company owns — a center, its own people, finished work in use every quarter — and we plan the handover from the first day. When the engagement ends, the capability stays. That is the difference from a consultancy, and it is the whole point."
  facts:
    - { k: "Practice", v: "HyperModo, a practice of Xymbia Inc." }
    - { k: "Based", v: "New York / Philadelphia; the Zones center in Islamabad" }
    - { k: "Specialization", v: "Enterprise data systems, and the people and process around them" }
    - { k: "Working now", v: "Zones LLC, program owner since 2022" }
principal:
  name: Wiqar Chaudry
  role: Principal
  photo: ""
  paras:
    - "Wiqar builds transformation engines inside companies. For the past four years that has meant one thing done end to end at Zones, a $3B IT solutions provider: framing the transformation with its executive team; standing up a center in Islamabad as the company's own venture — the entity, the office, the leadership; building a pipeline from top universities, a 12-month program for every graduate and a team that grew to 70+; and running the program so finished work reached the business every quarter while the core platform was built underneath. The handover is being planned now, and in 2027 the team he built delivers the next system without him."
    - "That work sits on twenty years of translating between a business and its engineers — product, marketing, architecture and data roles at Wasmer, Bugcrowd, Rackspace, NuoDB, Expressor, Memento and Epsilon, always with the business's goal on one side of the table and the people who had to build it on the other. Enterprise data is the constant: the systems he designed won an $83M contract, took a product to 30,000 downloads a month, and put a company on the Gartner Magic Quadrant."
    - "He still builds. For the past year most of the code on a live production platform has been written by AI agents under a framework he designed — the operating model HyperModo now installs for clients so the pace of engineering doesn't depend on who is in the room."
  facts:
    - { k: "Education", v: "MS, Computer Information Systems, Boston University · BBA, Finance, Temple University" }
    - { k: "Taught", v: "Systems design, Boston University Metropolitan College · Web development, Mercer County Community College" }
    - { k: "Contact", v: "wiqar@hypermodo.com · linkedin.com/in/wiqar" }
engage:
  heading: "How to engage"
  formats:
    - { title: "The full program", text: "Business case to go-live with one owner — the six steps as they ran at Zones. Multi-year; priced as an annual program." }
    - { title: "A single step", text: "The business case alone, the talent engine alone, or a 90-day strategy your team then executes — as at Bugcrowd. Fixed fee." }
    - { title: "Fractional leadership", text: "Head of platform or CTO, with a handover plan and a named successor from day one. Time and materials." }
  terms:
    - "Corp-to-corp through Xymbia Inc."
    - "Two to six weeks from a proposal to a start"
    - "Weekly written status from the first week"
    - "A handover plan in every proposal"
