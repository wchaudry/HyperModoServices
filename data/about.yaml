firm:
  heading: "A firm that works itself out of a job."
  paras:
    - "HyperModo helps companies build their own transformation engine: the continuous improvement of people, process and technology, at scale, so a business serves its customers, enters new markets and out-innovates its competitors."
    - "We do it as a venture the company owns — a center, its own people, finished work in use every quarter — and we plan the handover from the first day. When the engagement ends, the capability stays. That is the difference from a consultancy, and it is the whole point."
  facts:
    - { k: "Practice", v: "HyperModo, a practice of Xymbia Inc. — a team of four" }
    - { k: "Based", v: "New York / Philadelphia; work delivered in Islamabad since 2022" }
    - { k: "Specialization", v: "Enterprise data systems, and the people and process around them" }
    - { k: "Working now", v: "Zones LLC, program owner since 2022" }
principal:
  name: Wiqar Chaudry
  role: Principal
  photo: ""
  paras:
    - "Wiqar builds organizations that can transform themselves — and he has done it as a founder, as an operator, and as the owner of a client's program. The pattern is the same each time: frame the change with the people who own the outcome, stand up the capacity to deliver it as their own, hire and train the people, and deliver something real every quarter until the organization can carry on without him."
    - "As co-founder and Chief Product and Operations Officer of Nalej, an edge-computing company, he raised $2.5M, built and ran teams in Madrid and the United States, delivered a working system for Airbus in ninety days, and closed a five-year DARPA / AFRL contract with the certification it required. At Zones, a $3B IT solutions provider, he framed the transformation with the executive team, stood up a center in Islamabad as the company's own venture, built a university pipeline and a graduate program that grew the team to 70+, and has run the program since 2022 — with the handover now being planned. Before either: head of product at Wasmer, and product, marketing and architecture roles at Rackspace, NuoDB, Expressor, Memento and Epsilon, where the systems he designed won an $83M contract, took a product to 30,000 downloads a month, and put a company on the Gartner Magic Quadrant."
    - "He still builds. For the past year most of the code on a live production platform has been written by AI agents under a framework he designed — the operating model HyperModo now installs for clients so the pace of engineering doesn't depend on who is in the room."
  facts:
    - { k: "Education", v: "MS, Computer Information Systems, Boston University · BBA, Finance, Temple University" }
    - { k: "Taught", v: "Systems design, Boston University Metropolitan College · Web development, Mercer County Community College" }
    - { k: "Contact", v: "wiqar@hypermodo.com · linkedin.com/in/wiqar" }
