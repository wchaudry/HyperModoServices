firm:
  heading: "Built to be handed over."
  paras:
    - "HyperModo helps companies make transformation a culture, not a project. We improve people, process, and technology continuously and at scale, so the business can serve its customers, enter new markets, and outpace its competitors."
    - "From the first day, the client's people and ours work as one team, and AI is part of how that team learns, trains, and delivers. We measure ourselves on what is still running after we leave. The capability stays. The team that runs it stays. That is the whole point."
team:
  heading: "The team"
  line: "Small by design."
  sub: "We don't bring a bench. We build yours, and we work inside it."
  people:
    - slug: wiqar-chaudry
      name: "Wiqar Chaudry"
      role: "Principal"
      line: "Transformation strategy, program ownership, the venture and the talent engine."
      photo: "team/wiqar-chaudry.jpg"
      linkedin: "https://linkedin.com/in/wiqar"
      bio:
        - "Wiqar builds organizations that can transform themselves. He has done it as a founder, as an operator, and as the owner of a client's program, and the pattern is the same each time. Frame the change with the people who own the outcome. Build the capacity to deliver it as their own. Hire and train the people. Deliver something real every quarter until the organization can carry on without him."
        - "Through HyperModo he has owned Zones' transformation program since 2022, from the business case to a center of 70+ people the company recruited and trained as its own. Before that he took Wasmer's enterprise offer to market, and wrote the data and crowd strategies that Bugcrowd's own engineers built in full."
        - "He still builds. He designed the framework that lets a team use AI throughout a delivery, with the rules for what AI may do and who reviews the result, and it is the framework HyperModo now installs for clients."
      facts: []
    - slug: greg-cromwell
      name: "Greg Cromwell"
      role: "Principal Product Manager"
      line: "Use cases, requirements, roadmaps, and the reporting that tells the truth about delivery."
      photo: "team/greg-cromwell.jpg"
      linkedin: "https://linkedin.com/in/gcromwell"
      bio:
        - "Greg turns unclear business problems into products people actually use. He has spent more than a decade doing it on B2B and enterprise platforms in EdTech and HR Tech, and the work starts in the same place every time. Find the real use case. Write requirements engineers can build from. Keep the roadmap honest about what is shipping and what is not. Report on delivery in a way that tells leadership the truth, not what they hoped to hear."
        - "Through HyperModo he works inside the Zones program, where he leads a team of product managers and owns the platform fundamentals — enterprise access control, e-commerce, and the rollout rules that decide who sees what and when. Before that he was Senior Director of Product Management at ExecOnline, where he built the discovery and recommendations layer that made it easier for learners to find and finish programs as enrollment scaled."
        - "At Zones he designed the delivery framework his product managers work from, along with the libraries of reusable templates that go with it, built with AI, so every piece of work starts from something proven instead of a blank page. He is at his best building something from nothing, where no template exists yet, and he mentors the product managers around him, because the client's team should be able to do the job without him."
      facts: []
    - slug: aysha-williams
      name: "Aysha Williams"
      role: "UX Designer"
      line: "Journey maps, flows and screens validated before they're built."
      photo: "team/aysha-williams.jpg"
      linkedin: "https://linkedin.com/in/ayshawilliams"
      bio:
        - "Aysha uses her design perspective to help create experiences that prioritize clarity, innovation, and meaningful user interactions. She believes great UX is about more than how something looks. It's about creating experiences that feel natural, purposeful, and effortless. With a strong focus on understanding user needs, she combines research, interaction design, and problem-solving to design experiences that are both functional and engaging."
        - "Through HyperModo she works inside the Zones program and has over 4 years of experience working with the platform. She collaborates with cross-functional teams to translate business goals and user insights into thoughtful digital solutions. Her approach is grounded in empathy, usability, and continuous improvement, with a passion for creating products that work seamlessly for the people who use them."
      facts: []
  join:
    title: "Join the team"
    role: "Open to the right people"
    text: "We add people when the work calls for it — senior, hands-on, and at home working inside a client's team. If that's you, write to us."
    label: "See what we look for"
    url: "/join/"
