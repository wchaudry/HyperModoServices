runs:
  - when: "Day 1"
    title: A first conversation
    text: Where your business wants to go, what stands in the way, and whether we're the right people. Thirty minutes with whoever owns the outcome.
  - when: "Week 1–2"
    title: A scoped proposal
    text: The deliverables, who on your side owns each afterwards, the timeline, the price. Fixed fee or time and materials, corp-to-corp through Xymbia Inc.
  - when: "Weeks 2–6"
    title: The work begins
    text: Two to six weeks from the proposal to a start. Weekly written status from the first week — root causes and slips as they happen, not after.
  - when: "From day one"
    title: The handover
    text: Planned at the start, not the end. The engagement ends when your team is running it.
formats:
  - title: The full program
    text: Business case to go-live, with one owner — the six steps as they ran at Zones.
  - title: A single step
    text: The business case alone; the talent engine alone; a 90-day strategy your team then executes — as at Bugcrowd.
  - title: Fractional leadership
    text: Head of platform or CTO for a company that has the need and not the headcount, with a handover plan from day one.
