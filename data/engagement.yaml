heading: "From a first conversation to a handover that's planned on day one."
sub: "No discovery phase, no bench. A conversation, a scoped proposal, and work that starts within weeks."
runs:
  - when: "Day 1"
    title: A first conversation
    text: Where your business wants to go, what stands in the way, and whether we're the right people. Thirty minutes with whoever owns the outcome.
  - when: "Week 1–2"
    title: A scoped proposal
    text: The deliverables, who on your side owns each afterwards, the timeline, and the price.
  - when: "Then"
    title: The work begins
    text: Two to six weeks from the proposal to a start. Weekly written status from the first week — root causes and slips as they happen, not after.
  - when: "From day one"
    title: The handover
    text: Planned at the start, not the end. The engagement ends when your team is running it.
formats_heading: "Three ways to engage."
formats_sub: "The whole engine, one step of it, or a leader on loan until you've hired your own."
formats:
  - title: The full program
    text: Business outcome to handover — all six steps, with one owner, over years.
  - title: A single step
    text: The business outcome alone. The people alone. A 90-day strategy your team then executes.
  - title: Fractional leadership
    text: Head of platform or CTO for a company that has the need and not the headcount, with a handover plan and a named successor from day one.
