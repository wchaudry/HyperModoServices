eyebrow: What runs through every step
heading: Four things the loop can't turn without.
sub: "Learning and training, delivery, AI enablement, and measurement — what each one is, and what we do to make it run."
items:
  - title: Learning and training
    text: "Sized to the engagement. Building a new team is an 18-month program: six months to build the recruiting and training models, then 12 months rotating every hire through the disciplines on live deliverables. For people already in place, it is a curriculum designed from the gaps we measured. In a 90-day engagement, it is the specifications and working sessions that let your own engineers build the rest. Training is never a separate track — it always ends in something the business uses."
  - title: Delivery
    text: One workstream with training, on a quarterly cadence. Every quarter ships a finished increment into the business's hands, demoed to the people who will use it, while the larger platform takes shape underneath.
  - title: AI enablement
    text: An AI delivery framework installed in your repositories, where agents write most of the code and people write the specification, review the result, and own it. Every role learns to work in it — product, design and business owners, not only engineers.
  - title: Measurement and leadership reporting
    text: A baseline set in step three and a standing seat with senior leadership from then on. We report impact, progress toward the outcome, and root causes, and we revise the plan with you when the market moves.
