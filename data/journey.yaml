heading: "We help companies build their own transformation engine."
sub: "It starts with your executives and a plan the business actually wants. It ends with your own team running what we built together. These are the six steps between."
steps:
  - n: "01"
    title: Frame it with your executives
    text: "We find the barriers to scale, study the competition, and put the transformation in your business's own terms — where it is, where it's going, what has to change. That business case is what every later quarter is measured against."
    anchor: frame
  - n: "02"
    title: Stand up the venture
    text: "Capacity you can't hire at home, we build abroad: a new center in a low-cost geography — entity, office, leadership, staffing. Cost and risk fall. And it's yours: a venture the company owns, not a contract it renews."
    anchor: venture
  - n: "03"
    title: Build the talent engine
    text: "Top universities as the funnel and the farm system. Campus recruiting with assessments we write. Senior hires to seed the team and mentor it. A 12-month program for every graduate, delivering across disciplines before they specialize."
    anchor: talent
  - n: "04"
    title: Deliver every quarter
    text: "The training program and the delivery program are the same program. Every quarter, finished work lands in the business's hands — while the larger changes take shape underneath."
    anchor: ship
  - n: "05"
    title: Build what the business needs
    text: "Processes, products, platforms — whatever the transformation calls for, designed, built and put into use. Where it's software, most of the code is written by AI agents under a framework your people learn to run, so the pace stays when we go."
    anchor: systems
  - n: "06"
    title: Adjust continuously, with leadership
    text: "Markets move; so does the plan. We work with senior leadership throughout and measure by what changed — better process, better talent, better technology — and by what your customers get that they didn't before."
    anchor: adjust
