heading: "We help companies build their own transformation engine."
sub: "It starts with your executives and a plan the business actually wants. It ends with your own team running what we built together. These are the six steps between."
steps:
  - n: "01"
    title: Define the business outcome
    text: "We work with your executives to name what's blocking growth, who you're losing to, and what has to change. The result is a written outcome the business owns — and the measure for everything that follows."
    anchor: frame
  - n: "02"
    title: Identify the people
    text: "We identify who plays an active role in the transformation. If they're already in your company, good. If you need capacity, we add it locally — or build a team in a low-cost geography that's yours."
    anchor: venture
  - n: "03"
    title: Measure and fix the process
    text: "We map how work gets done today and measure it: who decides, who waits, where it stalls. Then we fix what's slow, cut what's pointless, and address the rest through training and deliveries."
    anchor: talent
  - n: "04"
    title: Build what the business needs
    text: "We determine the right solution for the job, build only what delivers a competitive advantage, and always prioritize pace of delivery through our use of AI."
    anchor: systems
  - n: "05"
    title: Deliver every quarter
    text: "Training and delivery unify into a single workstream that produces business value. Every quarter, finished work lands while the larger changes take shape underneath."
    anchor: ship
  - n: "06"
    title: Adjust continuously
    text: "We work with senior leadership throughout, measure what changed — the impact and the progress toward the business outcome — and make adjustments to stay on track."
    anchor: adjust
