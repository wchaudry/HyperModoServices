heading: Large-scale transformation, or one focused engagement.
sub: "Zones is the whole engine. These are pieces of it, done on their own — for a company making a market, and for one monetizing what it already had."
items:
  - client: Wasmer
    period: 2020 – 2022
    title: A runtime developers loved, and a market that didn't exist yet
    text: Wasmer had to make the enterprise market for WebAssembly, not just enter it. We defined the enterprise offer and its go-to-market, landed the first enterprise customers, and set up the sponsorship model that funds the open-source core.
    anchor: wasmer
  - client: Bugcrowd
    period: two 90-day engagements, 2019 – 2020
    title: A two-sided business sitting on data it wasn't using
    text: Bugcrowd serves companies on one side and security researchers on the other, and held years of data from both. We built the strategy to monetize it without tipping that balance — the diagnosis leadership acted on, a data services roadmap, and a crowd management system its own engineers built.
    anchor: bugcrowd
