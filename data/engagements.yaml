heading: Large-scale transformation, or one focused engagement.
sub: "Zones is the whole engine. These are pieces of it, done on their own — product and go-to-market for one company, data strategy for another."
items:
  - client: Wasmer
    period: 2020 – 2022
    title: The enterprise offer a runtime company took to market
    text: We framed the enterprise product and its go-to-market for a WebAssembly platform, landed its first enterprise customers, and set up the sponsorship model that funds the open-source core.
    anchor: wasmer
  - client: Bugcrowd
    period: two 90-day engagements, 2019 – 2020
    title: A data strategy for a company that was two businesses at once
    text: The diagnosis leadership acted on, a data services roadmap, and a crowd management system designed from first principles — built entirely by Bugcrowd's own engineers.
    anchor: bugcrowd
