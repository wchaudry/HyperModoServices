heading: More engagements
items:
  - client: Wasmer
    period: 2020–2022
    title: The enterprise plan a runtime company is still executing
    text: Head of product for a WebAssembly platform. Framed the enterprise offer and its go-to-market, ran the first enterprise customers, and built the sponsorship model that funds the open-source core.
    anchor: wasmer
  - client: Bugcrowd
    period: 2019–2020
    title: A data strategy for a company that was two businesses at once
    text: The diagnosis leadership acted on, a data services framework and roadmap, a crowd management system from first principles, and the prototypes engineering built from.
    anchor: bugcrowd
  - client: Teleport (then Gravitational)
    period: 2016–2017
    title: Early customers for an early Kubernetes platform
    text: Acted as a channel for Gravitational while the product was new — brought in some of its first customers and the partner and reseller leads that followed.
    anchor: teleport
