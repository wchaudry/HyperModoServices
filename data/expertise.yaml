- category: Transformation strategy
  key: transformation
  image: interchange.jpg
  alt: "A highway interchange from above at dusk, roads converging and splitting"
  stats: [{v: "4 years", l: "one owner, 2022 to today"}, {v: "5 legal entities", l: "US, Canada, UK, EMEA, India — one platform"}]
  line: "Transformation fails when it's framed by IT or by a vendor. We frame it with the people who own the outcome, then own the program from the business case to go-live, governed so value lands every quarter rather than at the end."
  items:
    - title: Business case and competitive analysis
      blurb: The barriers to scale, who is winning and on what, and the transformation in the business's own terms — built with the people who own the outcome.
      deliver: [Market sizing and competitive analysis, Business model and five-year objectives, "Vision, mission and SWOT the board can repeat", The executive presentation]
      proof: "Zones: framed with the CDO, approved by the executive team in March 2022, and the yardstick for every quarter since. Bugcrowd: the two-businesses diagnosis its leadership acted on."
    - title: Phased roadmap and first use case
      blurb: A transformation that proves itself early — a bounded first use case, and phases that each land value before the next begins.
      deliver: [A phased roadmap with what each phase proves, A bounded first use case, Dependencies and decision points named]
      proof: "Zones: three phases — a single source of truth, then experience management, then automation — with Phase 1 delivering four systems into use before the core platform. Bugcrowd: three quarters, sequenced from infrastructure to a data-services MVP."
    - title: Program ownership
      blurb: One owner from the business case to go-live — architecture, delivery organization, vendor management, executive reporting.
      deliver: [Program charter and governance, Executive reporting that names root causes, Vendor and partner management, A handover plan from day one]
      proof: "Zones: Program Owner since 2022 of a four-year, five-entity transformation for a $3B company — a center of 70+ people stood up and staffed, four systems in daily use, the core platform live in 2027, and a handover being planned."
    - title: Operating model and governance
      blurb: The rules of the road for a center and a program — decision rights, cadences, reporting, and what "done" means.
      deliver: [Decision rights and escalation paths, "Cadences — triage, reviews, leadership checkpoints", A written definition of done, KPI and status reporting the business trusts]
      proof: "Zones: a written definition of done and a handover scope defined as no Severity 1 or 2 open. Bugcrowd: an Enterprise Data Engineering group recommended, then staffed and run in-house."
    - title: Quarterly delivery and go-live
      blurb: Finished work in the business's hands every quarter, and a go-live that is evidenced, not hoped for.
      deliver: [A quarterly delivery cadence, Production-readiness assessment, A test plan sized in hours, "Cutover, support model, runbooks"]
      proof: "Zones: four systems delivered into daily use across 2023–2025; a 1,700-case test plan and a readiness assessment for the core platform going live in 2027."
- category: People strategy
  key: people
  image: seats.jpg
  dark: true
  alt: "Rows of blue seats in a lecture hall"
  stats: [{v: "Jul 2022", l: "Islamabad center kicked off"}, {v: "70+", l: "people, recruited and trained in-house"}, {v: "12 months", l: "the graduate program"}]
  line: "Transformation is capacity the company doesn't have. We build it as the company's own: a center in a low-cost geography, a pipeline from top universities, senior mentors, a 12-month program for every graduate — and a handover planned from the first day, so the capability stays when we leave."
  items:
    - title: The venture and the center
      blurb: A new center in a low-cost geography as the company's own — the location case, the entity, the office, the leadership, the operating model.
      deliver: [The location case, Entity and office set-up, Leadership hires and the operating model, A center that reports to you]
      proof: "Zones: the Islamabad center, kicked off in July 2022 as Zones' own — 70+ people today, recruited and trained in-house."
    - title: The talent engine
      blurb: Top universities as a funnel and farm system, senior hires to seed and mentor, assessments we write and grade.
      deliver: [University partnerships and campus recruiting, Assessments and interview process, Senior seed hires, A retention model]
      proof: "Zones: campus recruiting at top universities, assessments written in-house, senior mentors seeded into every cohort — the pipeline that grew the center from a first cohort to 70+."
    - title: Leadership and handover
      blurb: Fractional head of platform or CTO where the company has the need and not the headcount — with a named successor for every role we hold.
      deliver: [Architecture and delivery ownership, Hiring and assessment for leadership roles, Board and executive reporting, A handover plan and named successors]
      proof: "Zones: handover being planned now; in 2027 the Islamabad team delivers global e-commerce without us."
- category: Technical strategy
  key: technical
  image: circuit-blue.jpg
  dark: true
  alt: "A dark blue circuit board, close up"
  stats: [{v: "4", l: "systems in daily use at Zones"}, {v: "2027", l: "core platform live, delivered by the team"}]
  line: "A business shouldn't rent its own knowledge from its systems of record. Our positions: decouple from the ERP, data before experiences, a platform rather than a project, integrate early, make everything reproducible — and engineering throughput that doesn't depend on who is in the room."
  items:
    - title: Decouple the business from its systems of record
      spec: true
      blurb: The ERP is where transactions live, not where the business's knowledge should. Product, service and subscription data moves into a governed platform the business owns; the ERP becomes a consumer of it, kept in sync — and legacy is retired only after the platform has proven it can carry the load.
      deliver: [The target architecture and the seams between platform and ERP, Bi-directional synchronization so existing investment keeps working, A migration path with legacy retired on evidence, Business rules recovered from the ERP and made configurable]
      proof: "Zones: twenty years of rules recovered from AX and coded into a rules engine the business configures; D365 F&O kept in bi-directional sync with the platform; the ERP no longer the place product knowledge lives."
    - title: Data first, experiences on top
      blurb: One governed source of truth before any experience is built on it — a three-tier model with lineage to the source, and rules for validation, correction and precedence the business configures itself. Merchandising, commerce and AI come after the foundation holds, not before.
      deliver: ["A master-data model with lineage — transaction, staging, master", A rules engine the business owns, Ingestion from every feed the business depends on, "A phased sequence — foundation, then experience, then automation"]
      proof: "Zones: Phase 1 delivered identity, ingestion, order approvals and pricing into use ahead of the core data and merchandising platform, now in final testing — with experience management and AI as Phases 2 and 3, in that order."
    - title: A platform, not a project
      blurb: Every component built as a product that could stand alone — extensible by design, tenant-ready by default. Every connector on a plugin framework; every application registered against the identity layer; the deployment able to take a second customer without a rebuild.
      deliver: [A plugin framework for connectors and transforms, An identity layer other applications register against, Multi-tenant deployment from day one, "Components with a commercial path — SaaS, integration services, data-as-a-service"]
      proof: "Zones: every connector on the plugin framework; Simple Docs built and registered as a third-party app to prove the ecosystem model; Access Studio designed as standalone authentication; the cloud deployment sized for additional customers by default."
    - title: Integrate early, find the unknowns
      blurb: The value of a platform is only realized when it's connected, so integration starts before the platform is finished — small sprints against real systems to surface the unknown unknowns while they're cheap.
      deliver: [Integration sprints against live systems from the first quarter, A test plan derived from the integration surface, Recurring data refreshes so comparison testing is honest, Fast fixes for the gaps integration exposes]
      proof: "Zones: D365 integration built and tested alongside the platform; recurring F&O refreshes keep environments aligned for comparative testing; a 1,700-case plan across ingestion, rules and the F&O seam."
    - title: Everything reproducible, everything observable
      blurb: Infrastructure as code so the estate can be rebuilt, monitoring so it can be trusted, and a readiness assessment that says plainly what has and hasn't been validated.
      deliver: ["Infrastructure as code — network, compute, data, secrets", Monitoring and alerting into the tools the team already uses, A production-readiness assessment with named gaps and owners, "A support model — tiers, runbooks, cross-training"]
      proof: "Zones: a hub-and-spoke Azure estate, 99% Terraform-managed, WAF on production, alerts to Teams — and a December 2025 readiness assessment that separated what was built from what was proven."
    - title: Throughput that outlasts the team
      blurb: "Most of the code written by AI agents under a written operating model — so the pace of engineering doesn't depend on who is in the room. The model is taught to the whole team, not kept by us — see AI enablement under specialized capabilities."
      deliver: [The agentic framework installed in the client's repositories, Review gates as code, Engineers trained to direct and review agent-written code]
      proof: "Zones: a live production platform where most new code is agent-written under the framework, and the team that runs it was trained on it in place."
- category: Specialized capabilities
  key: capabilities
  image: gauge.jpg
  alt: "A precision measuring gauge, close up"
  line: "The disciplines we bring to a step when it needs them — AI enablement, product, marketing, design, training. Each is a practice in its own right, and each ends in a deliverable your people own."
  items:
    - title: AI enablement for the whole team
      spec: true
      blurb: Not "AI solves your problems" — your people, enabled with AI, solving them faster and to a higher standard than they could before. The framework and the daily workflow, taught to every engineer, product manager and designer, so it becomes how the organization works rather than a tool a few people try.
      deliver: ["The operating model — directives, session protocols, a persistent knowledge base — installed in your repositories", "A daily workflow for engineers, product and design, with the review gates that make it safe", "Hands-on training by delivering real work with it, not a course", "Quality measured at the gate — every change reviewed to a written standard before it ships"]
      proof: "Zones: the entire team — 70+ engineers, product and design — brought onto the framework and using AI as part of their daily work, delivering higher-quality features faster on a live production platform: 59 engineering projects, 3,300+ recorded findings and decisions, every change reviewed to a written standard."
    - title: Product management
      blurb: The work between "we should do this" and "it's in use."
      deliver: [North-star use cases with acceptance criteria, Requirements ahead of development and the test plan derived from them, Roadmaps and phase gates, Program reporting with numbers]
      proof: "Wasmer: the enterprise plan the company is executing. Zones: the north-star use cases, requirements and a 1,700-case test plan for the core platform. Memento: a fraud platform expanded from internal fraud to check fraud, card bust-out and AML, later acquired by FIS."
    - title: Product marketing and go-to-market
      blurb: Positioning, launch and the content that sells a technical product to technical buyers.
      deliver: ["Positioning and messaging, with the competitive analysis behind it", "Launch — site, papers, demos, campaigns", "Sales enablement and analyst positioning", Due-diligence material for an acquisition]
      proof: "NuoDB onto the Gartner Magic Quadrant. Expressor to 30,000 downloads a month, and the diligence behind its acquisition by Qlik. Wasmer's go-to-market and open-source sponsorship model. BizAnalytica's services go-to-market."
    - title: UX and design systems
      blurb: Screens validated before they're built, and the tokens and components that make them real — published as packages your engineers install.
      deliver: [Journey maps and Figma flows tested against real process, "Design tokens — color, type, spacing, light and dark", A component library as versioned npm packages with docs, "Mobile where it's needed — Flutter"]
      proof: "Zones: the platform mockups that turned the strategy into an approved build, and the PIM experience its users work in. Our own design system: 73 releases, 26 component families, a 67-page docs site; and a Flutter app with 83 screens."
    - title: Technical training programs
      blurb: People trained by delivering real work across disciplines, on a rotation, with a mentor. Not a bootcamp.
      deliver: [A curriculum per discipline built from your stack and backlog, A 12-month rotation on real deliverables, A management track and a technical-expert track, Success measured by what was delivered and who stayed]
      proof: "The Zones Digital Leadership Program — 12 months for fresh graduates across DevOps, UI, backend, frontend, product and security, on production systems. At university: graduate instructor in systems design at Boston University's Metropolitan College; adjunct professor of web development at Mercer County Community College."
