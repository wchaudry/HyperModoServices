- category: Transformation strategy
  key: transformation
  image: interchange.jpg
  alt: "A highway interchange from above at dusk, roads converging and splitting"
  line: "Transformation fails when it is framed by IT or by a vendor. We frame it with the people who own the outcome, then own the program from the business case to go-live, so that value lands every quarter rather than at the end."
  seen: { label: "Seen in full: the Zones case study", url: "/work/zones/" }
  items:
    - key: business-case
      title: Business case and competitive analysis
      blurb: Where growth has to come from, how you outpace your competitors, and what has to change — written as a case the executive team can approve.
      deliver: [Market sizing and competitive analysis, Business model and five-year objectives, "Vision, mission and a SWOT the board can repeat", The executive presentation]
    - key: roadmap
      title: Phased roadmap and first use case
      blurb: A transformation that proves itself early, with a bounded first use case and phases that each land value before the next begins.
      deliver: [A phased roadmap with what each phase proves, A bounded first use case, Dependencies and decision points named]
    - key: program-ownership
      title: Program ownership
      blurb: One owner from the business case to go-live. We run the architecture, the delivery team, the vendors and the reporting to the executive team, so no one else has to hold the pieces together.
      deliver: [Program charter and governance, Executive reporting that names root causes, Vendor and partner management, A handover plan from day one]
    - key: operating-model
      title: Operating model and governance
      blurb: The rules of the road for a center and a program — who decides, on what cadence, reported how, and what "done" means.
      deliver: [Decision rights and escalation paths, "Cadences — triage, reviews, leadership checkpoints", A written definition of done, KPI and status reporting the business trusts]
    - key: go-live
      title: Quarterly delivery and go-live
      blurb: Finished work in the business's hands every quarter, and a go-live that is evidenced rather than hoped for.
      deliver: [A quarterly delivery cadence, A production-readiness assessment with named gaps and owners, A test plan derived from the integration surface, "Cutover, support model and runbooks"]
- category: People strategy
  key: people
  image: seats.jpg
  alt: "Rows of blue seats in a lecture hall"
  line: "Transformation needs people the company doesn't have yet. Where they exist, we get them the time. Where they don't, we build them as the company's own, locally or in a low-cost geography, and we plan the handover from the first day."
  seen: { label: "Seen in full: the Zones case study", url: "/work/zones/" }
  items:
    - key: venture
      title: The venture and the center
      blurb: A new center in a low-cost geography, owned by the company. We make the case for where, set up the entity and the office, hire the leadership, and write the operating model. Building abroad is a decision, not a default.
      deliver: [The capacity decision and the location case, Entity and office set-up, Leadership hires and the operating model, A center that reports to you]
    - key: talent
      title: The talent engine
      blurb: Top universities are the funnel. Senior hires seed and mentor every cohort. We write the assessments, and people grade them.
      deliver: [University partnerships and campus recruiting, Assessments and the interview process, Senior seed hires, A retention model]
    - key: training
      title: Technical training programs
      blurb: People learn by delivering real work, across disciplines, on a rotation, with a mentor beside them. The program is sized to the engagement, from working sessions inside a 90-day engagement to an 18-month program for a new team.
      deliver: [A curriculum per discipline built from your stack and backlog, A 12-month rotation on real deliverables, Senior mentors in every team, Success measured by what was delivered and who stayed]
    - key: leadership
      title: Leadership and handover
      blurb: A head of platform or CTO on loan, for a company that has the need and not the headcount. Every role we hold has a named successor from the first day.
      deliver: [Architecture and delivery ownership, Hiring and assessment for leadership roles, Board and executive reporting, A handover plan and named successors]
- category: Technical strategy
  key: technical
  image: circuit-blue.jpg
  alt: "A dark blue circuit board, close up"
  line: "Every transformation runs on systems. Ours start from one principle — the business owns its knowledge, not its software — and everything else follows from it. Our specialization is enterprise data, because that is where a company's knowledge lives and every other system depends on it."
  seen: { label: "Seen in full: the Zones and Bugcrowd case studies", url: "/work/" }
  items:
    - key: own
      title: Own your knowledge
      spec: true
      blurb: A company's knowledge — what it sells, at what price, to whom, under which rules — shouldn't live inside a vendor's software where only a few people can reach it. We move it into a platform the business owns and governs. The ERP, CRM, and billing system keep working, but they stop being the only place the truth lives.
      deliver: [Product changes made by the people who own the products, Business rules the business can read and change itself, Systems of record that keep running while the platform takes over, "Legacy retired on evidence, not on a date"]
    - key: foundation
      title: Build the foundation first
      blurb: Every new experience — a storefront, a portal, an AI feature — is only as good as the data underneath it. So we build one governed source of truth before we build anything on top, and we sequence the work so the business sees value every quarter while the foundation goes in.
      deliver: [One source of truth for the data the business runs on, Value delivered every quarter while the foundation is built, "A sequence the executive team can see — foundation, then experience, then automation"]
    - key: platforms
      title: Build platforms, not projects
      blurb: A project ends. A platform takes the next system, the next market, and the next acquisition without starting over. We build every part so it can stand on its own and serve a second business from day one, because growth by acquisition is only as fast as the systems that absorb it.
      deliver: [A platform that absorbs an acquired business without a rebuild, Components that can be sold or reused — as a service or as a product, "The next system built on the last one, not beside it"]
    - key: connect
      title: Connect early
      blurb: The expensive surprises in any build are in the connections to the systems the business already runs. We connect early and often, in short sprints against the real systems, so the surprises show up while they are still cheap and the go-live date holds.
      deliver: [Integration proven from the first quarter, A test plan built from the real connections, A go-live date that survives contact with the existing systems]
    - key: trust
      title: Make it something the business can trust
      blurb: Before anything goes live, the business should know exactly what has been tested and what hasn't, and the team should be able to rebuild the whole environment from scratch. We build it that way, and we write it down.
      deliver: [A readiness assessment that says plainly what has been proven, An environment that can be rebuilt from code, "Monitoring the team already watches, and a support model it can run"]
    - key: pace
      title: Keep the pace
      blurb: The pace of delivery shouldn't depend on who happens to be in the room. The team uses AI throughout the build under a framework that says what AI may do and who reviews the result, and we teach that framework to everyone so the pace holds after we leave.
      deliver: [A delivery pace that does not depend on headcount, "A framework that says what AI may do, and who reviews it", A team that keeps the pace after the handover]
- category: Specialized capabilities
  key: capabilities
  image: movement3.jpg
  alt: "A mechanical watch movement, close up"
  line: "The disciplines we bring to a step when it needs them — AI enablement, data and platform engineering, product, marketing, design. Each is a practice in its own right, and each ends in a deliverable your people own."
  seen: { label: "Seen in full: the Wasmer and Bugcrowd engagements", url: "/work/" }
  items:
    - key: ai
      title: AI enablement for the whole team
      spec: true
      blurb: AI doesn't solve a company's problems. People do, and with AI in hand they solve them faster and to a higher standard. We teach the framework and the daily workflow to every function the transformation touches, not only engineering, so it becomes how the company works rather than a tool a few people try.
      deliver: ["The operating model — directives, session protocols, a shared knowledge base — installed in your repositories", "A daily workflow for engineers, product and design, with the review gates that make it safe", "Hands-on training by delivering real work with it, not a course", "Quality measured at the gate — every change reviewed to a written standard before it ships"]
    - key: data-platforms
      title: Enterprise data platforms
      blurb: This is the engineering behind owning your knowledge. We build the master-data model, with every record traceable to its source. We build the rules engine the business configures itself. We bring in every feed the business depends on, and we keep the ERP and the other systems of record in sync, so nothing the company already paid for stops working.
      deliver: ["A master-data model with lineage — transaction, staging, master", A rules engine the business owns, Ingestion from every feed the business depends on, Two-way synchronization with the ERP and other systems of record, A migration path with legacy retired on evidence]
    - key: platform-engineering
      title: Platform and cloud engineering
      blurb: This is the engineering behind platforms that last. Connectors plug in rather than getting rebuilt. Every application signs in through one identity layer. The platform can serve a second business from the first day. The whole environment is defined in code, and the monitoring lands in the tools the team already watches.
      deliver: [A plugin framework for connectors and transforms, An identity layer other applications register against, Multi-tenant deployment from day one, "Infrastructure as code — network, compute, data, secrets", Monitoring and alerting into the tools the team already uses, "A support model — tiers, runbooks, cross-training"]
    - key: product
      title: Product management
      blurb: Product management is the work between "we should do this" and "it is in use." We write the use cases and what done means, get the requirements ahead of the developers, sequence the roadmap, and report progress to leadership with numbers rather than adjectives.
      deliver: [North-star use cases with acceptance criteria, Requirements ahead of development and the test plan derived from them, Roadmaps and phase gates, Program reporting with numbers]
    - key: marketing
      title: Product marketing and go-to-market
      blurb: Selling a technical product to technical buyers is its own discipline. We work out the positioning and the messaging, back it with the competitive analysis, and produce the launch — the site, the papers, the demos, the campaigns — and the material a sales team and an analyst need to repeat it.
      deliver: ["Positioning and messaging, with the competitive analysis behind it", "Launch — site, papers, demos, campaigns", Sales enablement and analyst positioning, Due-diligence material for an acquisition]
    - key: design
      title: UX and design systems
      blurb: We test the screens against the real process before anyone builds them. Then we build the design system that makes them real — the colors, type, and spacing as tokens, and the components as versioned packages an engineering team installs and keeps.
      deliver: [Journey maps and Figma flows tested against real process, "Design tokens — color, type, spacing, light and dark", A component library as versioned packages with documentation, "Mobile where it is needed"]
