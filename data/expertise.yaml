- category: Transformation strategy
  key: transformation
  image: interchange.jpg
  alt: "A highway interchange from above at dusk, roads converging and splitting"
  line: "Transformation fails when it is framed by IT or by a vendor. We frame it with the people who own the outcome, then own the program from the business case to go-live, so that value lands every quarter rather than at the end."
  seen: { label: "Seen in full: the Zones case study", url: "/work/zones/" }
  items:
    - key: business-case
      title: Business case and competitive analysis
      blurb: Where growth has to come from, how you outpace your competitors, and what has to change — written as a case the executive team can approve.
      deliver: [Market sizing and competitive analysis, Business model and five-year objectives, "Vision, mission and a SWOT the board can repeat", The executive presentation]
    - key: roadmap
      title: Phased roadmap and first use case
      blurb: A transformation that proves itself early, with a bounded first use case and phases that each land value before the next begins.
      deliver: [A phased roadmap with what each phase proves, A bounded first use case, Dependencies and decision points named]
    - key: program-ownership
      title: Program ownership
      blurb: One owner from the business case to go-live — architecture, the delivery organisation, vendors, and reporting to the executive team.
      deliver: [Program charter and governance, Executive reporting that names root causes, Vendor and partner management, A handover plan from day one]
    - key: operating-model
      title: Operating model and governance
      blurb: The rules of the road for a center and a program — who decides, on what cadence, reported how, and what "done" means.
      deliver: [Decision rights and escalation paths, "Cadences — triage, reviews, leadership checkpoints", A written definition of done, KPI and status reporting the business trusts]
    - key: go-live
      title: Quarterly delivery and go-live
      blurb: Finished work in the business's hands every quarter, and a go-live that is evidenced rather than hoped for.
      deliver: [A quarterly delivery cadence, A production-readiness assessment with named gaps and owners, A test plan derived from the integration surface, "Cutover, support model and runbooks"]
- category: People strategy
  key: people
  image: seats.jpg
  alt: "Rows of blue seats in a lecture hall"
  line: "Transformation is capacity the company does not have yet. Where the people exist, we get them the time. Where they do not, we build them as the company's own — locally or in a low-cost geography — with a handover planned from the first day."
  seen: { label: "Seen in full: the Zones case study", url: "/work/zones/" }
  items:
    - key: venture
      title: The venture and the center
      blurb: A new center in a low-cost geography as the company's own — the location case, the entity, the office, the leadership and the operating model. A decision, not a default.
      deliver: [The capacity decision and the location case, Entity and office set-up, Leadership hires and the operating model, A center that reports to you]
    - key: talent
      title: The talent engine
      blurb: Top universities as the funnel, senior hires to seed and mentor, and assessments we write and people grade.
      deliver: [University partnerships and campus recruiting, Assessments and the interview process, Senior seed hires, A retention model]
    - key: training
      title: Technical training programs
      blurb: People trained by delivering real work across disciplines, on a rotation, with a mentor. Sized to the engagement, from working sessions in a 90-day engagement to an 18-month program for a new team.
      deliver: [A curriculum per discipline built from your stack and backlog, A 12-month rotation on real deliverables, A management track and a technical-expert track, Success measured by what was delivered and who stayed]
    - key: leadership
      title: Leadership and handover
      blurb: A fractional head of platform or CTO where the company has the need and not the headcount — with a named successor for every role we hold.
      deliver: [Architecture and delivery ownership, Hiring and assessment for leadership roles, Board and executive reporting, A handover plan and named successors]
- category: Technical strategy
  key: technical
  image: circuit-blue.jpg
  alt: "A dark blue circuit board, close up"
  line: "A business should not rent its own knowledge from its systems of record. Our positions: decouple from the ERP, data before experiences, a platform rather than a project, integrate early, make everything reproducible — and a pace of delivery that does not depend on who is in the room."
  seen: { label: "Seen in full: the Zones and Bugcrowd case studies", url: "/work/" }
  items:
    - key: decouple
      title: Decouple the business from its systems of record
      spec: true
      blurb: The ERP is where transactions live, not where the business's knowledge should. Product, service and subscription data moves into a governed platform the business owns; the ERP becomes a consumer of it, kept in sync, and legacy is retired only once the platform has proven it can carry the load.
      deliver: [The target architecture and the seams between platform and ERP, Two-way synchronisation so existing investment keeps working, A migration path with legacy retired on evidence, Business rules recovered from the ERP and made configurable by the business]
    - key: data-first
      title: Data first, experiences on top
      blurb: One governed source of truth before any experience is built on it, with lineage to the source and rules for validation, correction and precedence that the business configures itself.
      deliver: ["A master-data model with lineage — transaction, staging, master", A rules engine the business owns, Ingestion from every feed the business depends on, "A phased sequence — foundation, then experience, then automation"]
    - key: platform
      title: A platform, not a project
      blurb: Every component built as a product that could stand alone — extensible by design and tenant-ready by default, so the platform can take a second business without a rebuild.
      deliver: [A plugin framework for connectors and transforms, An identity layer other applications register against, Multi-tenant deployment from day one, "Components with a commercial path — SaaS, integration services, data-as-a-service"]
    - key: integrate
      title: Integrate early, find the unknowns
      blurb: The value of a platform is only realised when it is connected, so integration starts before the platform is finished — small sprints against real systems to surface the unknowns while they are cheap.
      deliver: [Integration sprints against live systems from the first quarter, A test plan derived from the integration surface, Recurring data refreshes so comparison testing is honest, Fast fixes for the gaps integration exposes]
    - key: reproducible
      title: Everything reproducible, everything observable
      blurb: Infrastructure as code so the estate can be rebuilt, monitoring so it can be trusted, and a readiness assessment that says plainly what has and has not been validated.
      deliver: ["Infrastructure as code — network, compute, data, secrets", Monitoring and alerting into the tools the team already uses, A production-readiness assessment with named gaps and owners, "A support model — tiers, runbooks, cross-training"]
    - key: throughput
      title: A pace that does not depend on headcount
      blurb: Your people and ours use AI throughout the build, under a framework that says what it may do and who reviews it. The framework is installed in your repositories and taught to the whole team, so the pace of delivery survives the people who set it.
      deliver: [The AI delivery framework installed in the client's repositories, Review gates as code, Engineers trained to direct and review AI-assisted work]
- category: Specialized capabilities
  key: capabilities
  image: movement3.jpg
  alt: "A mechanical watch movement, close up"
  line: "The disciplines we bring to a step when it needs them — AI enablement, product, marketing, design. Each is a practice in its own right, and each ends in a deliverable your people own."
  seen: { label: "Seen in full: the Wasmer and Bugcrowd engagements", url: "/work/" }
  items:
    - key: ai
      title: AI enablement for the whole team
      spec: true
      blurb: Not "AI solves your problems" — your people, working with AI, solving them faster and to a higher standard than before. The framework and the daily workflow are taught to every function the transformation touches, so it becomes how the organisation works rather than a tool a few people try.
      deliver: ["The operating model — directives, session protocols, a shared knowledge base — installed in your repositories", "A daily workflow for engineers, product and design, with the review gates that make it safe", "Hands-on training by delivering real work with it, not a course", "Quality measured at the gate — every change reviewed to a written standard before it ships"]
    - key: product
      title: Product management
      blurb: The work between "we should do this" and "it is in use."
      deliver: [North-star use cases with acceptance criteria, Requirements ahead of development and the test plan derived from them, Roadmaps and phase gates, Program reporting with numbers]
    - key: marketing
      title: Product marketing and go-to-market
      blurb: Positioning, launch and the content that sells a technical product to technical buyers.
      deliver: ["Positioning and messaging, with the competitive analysis behind it", "Launch — site, papers, demos, campaigns", Sales enablement and analyst positioning, Due-diligence material for an acquisition]
    - key: design
      title: UX and design systems
      blurb: Screens validated before they are built, and the tokens and components that make them real — published as packages your engineers install.
      deliver: [Journey maps and Figma flows tested against real process, "Design tokens — colour, type, spacing, light and dark", A component library as versioned packages with documentation, "Mobile where it is needed"]
