- n: "01"
  title: Define the business outcome
  happens: Working sessions with the executives who own the outcome. We name what's blocking growth, who you're losing to, and what has to change in people, process and technology. It ends in a written outcome the business owns, and the measure for everything that follows.
  get:
    - Market and competitive analysis
    - The business outcome, in writing, with its measure
    - A phased roadmap with a bounded first use case
    - The business case and the executive presentation
  asks: Executive time, access to the numbers, and a decision at the end.
- n: "02"
  title: Identify the people
  happens: We identify who plays an active role in the transformation — the sponsors, the owners of each outcome, and the people who will run what gets built. If they're already in your company, good. If you need capacity, we add it locally, or build a team in a low-cost geography that's yours.
  get:
    - The stakeholder map — who decides, who owns, who runs
    - A staffing plan, and the hires to fill it
    - Where capacity is built abroad — the location case, the entity, its leadership, and a center that reports to you
    - A recruiting pipeline, with assessments we write and grade
  asks: Hiring authority, and a sponsor who can open an entity if one is needed.
- n: "03"
  title: Measure and fix the process
  happens: We map how work gets done today and measure it — who decides, who waits, where it stalls. Then we fix what's slow, cut what's pointless, and address the rest through training and deliveries.
  get:
    - The process map, with its measures
    - The fixes, made
    - A training curriculum tied to the deliveries
    - The baseline the transformation is measured against
  asks: Access to the people doing the work, and permission to change how it's done.
- n: "04"
  title: Build what the business needs
  happens: Processes, products, platforms — whatever the outcome calls for. We determine the right solution for the job, build only what delivers a competitive advantage, and prioritize pace of delivery through our use of AI. Where it's software, most of the code is written by AI agents under a framework your people learn to run.
  get:
    - The systems and processes, in use
    - Designs and documentation your team owns
    - The AI delivery framework, installed in your repositories
    - Your team, working in it
  asks: Decisions on scope, and a named owner for each system afterwards.
- n: "05"
  title: Deliver every quarter
  happens: Training and delivery unify into a single workstream that produces business value. Every quarter, finished work lands in the business's hands while the larger changes take shape underneath — built by the people being trained.
  get:
    - A quarterly delivery cadence
    - Finished increments, in use
    - Progress leadership can see without a status deck
  asks: Business owners who will use what's delivered and say what's wrong with it.
- n: "06"
  title: Adjust continuously
  happens: We work with senior leadership throughout, measure what changed — the impact and the progress toward the business outcome — and make adjustments to stay on track. The handover is planned from day one, so the engine keeps running without us.
  get:
    - Leadership reporting with root causes, not mood
    - The plan, revised as the market moves
    - A handover plan, and a named successor for every role we hold
  asks: A standing seat at the leadership table, and honesty in both directions.
