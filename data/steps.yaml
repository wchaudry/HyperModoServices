- n: "01"
  title: Frame it with your executives
  happens: Working sessions with the people who own the outcome. We name the barriers to scale, study who is winning and on what, and put the transformation in your business's own terms — where it is, where it's going, what has to change in people, process and technology.
  get:
    - Market and competitive analysis
    - The business model and five-year objectives
    - The transformation, framed for your board
    - A phased roadmap with a bounded first use case
    - The executive presentation
  asks: Executive time, access to the numbers, and a decision at the end.
  zones: "Framed with the CDO; approved by the executive team, March 2022."
- n: "02"
  title: Stand up the venture
  happens: Capacity you can't hire at home, built abroad — a new center in a low-cost geography, as your own entity, with its office, leadership and staffing plan. Cost and risk fall; the company owns a venture, not a contract.
  get:
    - The location case
    - The entity, office and operating model
    - Leadership hires
    - A center that reports to you
  asks: A sponsor with authority to open an entity, and a budget owner.
  zones: "Islamabad center kicked off July 2022, Zones' own."
- n: "03"
  title: Build the talent engine
  happens: Top universities as funnel and farm system. Campus recruiting, with assessments we write and grade. Senior hires to seed and mentor the team. A 12-month program that rotates every graduate through disciplines on real deliverables.
  get:
    - The recruiting pipeline and university partnerships
    - Assessments we write and grade, and the interview process
    - Senior seed hires
    - The 12-month graduate program
    - A retention model
  asks: Hiring authority in the center, and patience through the first cohort.
  zones: "70+ people today, recruited and trained in-house."
- n: "04"
  title: Deliver every quarter
  happens: Multidisciplinary teams deliver finished work into the business's hands every quarter while the larger changes take shape underneath — the same teams the talent engine is training.
  get:
    - A quarterly delivery cadence
    - Finished increments, in use
    - Progress leadership can see without a status deck
  asks: Business owners who will use what's delivered and say what's wrong with it.
  zones: "Four systems in daily use: pricing, identity, catalog processing, order approvals."
- n: "05"
  title: Build what the business needs
  happens: Processes, products, platforms — whatever the transformation calls for — designed, built and put into use. Where it's software, most of the code is written by AI agents under a framework your people learn to run.
  get:
    - The systems and processes, in use
    - Designs and documentation your team owns
    - For software, the agentic operating model installed in your repositories
  asks: Decisions on scope, and the people who will own each system afterwards.
  zones: "Core data and merchandising platform in final testing; live early 2027."
- n: "06"
  title: Adjust continuously, with leadership
  happens: Markets move; so does the plan. Reporting that names root causes, adjustments made in partnership with senior leadership, and a handover planned from day one so the engine keeps running without us.
  get:
    - Leadership reporting with root causes, not mood
    - The plan, revised as the market moves
    - A handover plan, and a named successor for every role we hold
  asks: A standing seat at the leadership table, and honesty in both directions.
  zones: "Handover being planned; in 2027 the team delivers global e-commerce on its own."
