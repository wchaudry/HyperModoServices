eyebrow: Why it works
heading: "Three ways transformation fails."
sub: "And what we do differently at each one, so this one doesn't."
left: The usual program
right: This model
points:
  - label: People
    fail: "<b>The people never arrive.</b> Hiring lags, the plan slips, and the slip becomes the program."
    answer: "<b>People come first.</b> We identify who's needed and build the capacity — in your company, locally, or in a low-cost geography that's yours."
  - label: Process
    fail: "<b>The process stays the same.</b> New systems land on old ways of working, and the old ways win."
    answer: "<b>We measure and fix the process before we build.</b> Training and delivery are one workstream, so the new way is learned by doing it."
  - label: Technology
    fail: "<b>The technology is built and never used.</b> Two years, one cutover, and nothing anyone can touch until then."
    answer: "<b>Something real is delivered every quarter.</b> Only what gives you an advantage, at a pace AI makes possible — and the capability stays with your team."
