eyebrow: Why it works
heading: "Three ways transformation fails."
sub: "And what we do differently at each one, so this one doesn't."
left: The usual program
right: This model
points:
  - photo: graduates.jpg
    alt: "Graduates at a ceremony"
    fail: "<b>Hiring lags, the plan slips, and the slip becomes the program.</b> Eighteen months in, the org chart is still the risk register."
    answer: "<b>The people are the first deliverable.</b> A center, a pipeline from top universities, senior mentors, and a rotation that turns graduates into people who deliver — before the big build starts."
  - photo: stickies.jpg
    alt: "Two people planning a quarter on a wall of notes"
    fail: "<b>Everything lands at go-live — if go-live lands.</b> Two years, one cutover, and nothing a customer can touch until then."
    answer: "<b>Something is delivered every quarter, from the first.</b> Finished work, in use, is how the team learns and how leadership sees progress — no two-year wait for a cutover."
  - photo: engineers-pair.jpg
    alt: "Two engineers working side by side"
    fail: "<b>The consultants leave with the expertise.</b> What remains is a capability nobody inside owns and a contract to renew."
    answer: "<b>It's your venture from day one.</b> Your entity, your people, your systems, with the handover planned at the start. When we step back, nothing stops."
