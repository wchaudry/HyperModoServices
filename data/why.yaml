eyebrow: Why it works
heading: "Built for the ways transformation usually fails."
sub: "Most programs don't fail on technology. They fail on people, timing and ownership. The model is designed around all three."
points:
  - fail: The program stalls for lack of people
    answer: So the people come first. A center, a pipeline, senior mentors, a rotation that turns graduates into engineers who ship. Capacity is the first deliverable, not the thing you hope arrives later.
  - fail: Value arrives at go-live — if it arrives
    answer: So value lands every quarter, from the first. The training program is the delivery program; production-ready work is how the team learns and how the business sees progress.
  - fail: The consultants leave, and so does the expertise
    answer: So the venture is yours from day one — your entity, your people, your systems — with a handover planned from the start. When we step back, nothing stops.
