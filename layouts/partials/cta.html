{{ $c := hugo.Data.cta }}
<section id="talk" style="padding-top:0">
  <div class="wrap">
    <div class="cta">
      <span class="eyebrow cta-eyebrow">{{ $c.eyebrow }}</span>
      <h2 style="margin-top:14px">{{ $c.heading }}</h2>
      <p>{{ $c.text }}</p>
      <div class="ctas"><a class="btn primary" href="{{ "/contact/" | relURL }}">{{ $c.primary_label }}</a>{{ with .Site.Params.booking }}<a class="btn ghost" href="{{ . }}">Book a call</a>{{ end }}{{ with $c.secondary_url }}<a class="btn ghost" href="{{ . | relURL }}">{{ $c.secondary_label }}</a>{{ end }}</div>
      <p class="cta-foot">{{ .Site.Params.email }}</p>
    </div>
  </div>
</section>
