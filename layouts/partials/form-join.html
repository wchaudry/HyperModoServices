<form class="contact-form" data-form="join" data-endpoint="{{ .Site.Params.forms_endpoint }}" data-email="{{ .Site.Params.email }}" data-recaptcha="{{ .Site.Params.recaptcha_site_key }}">
  <div class="f2">
    <label>Your name<input name="name" type="text" required autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
  </div>
  <label>LinkedIn<input name="linkedin" type="url" placeholder="https://linkedin.com/in/…" autocomplete="url"></label>
  <label>Tell us about yourself<textarea name="about" rows="4" required placeholder="What you've built, who you've taught, and why this…"></textarea></label>
  <label class="filefield">Résumé <span class="hint">PDF, up to 10 MB</span><span class="filebox"><span class="filename" data-empty="Choose a PDF…">Choose a PDF…</span><span class="btn ghost small">Browse</span></span><input name="file" type="file" accept="application/pdf"></label>
  <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <button class="btn primary" type="submit">Send</button>
  <p class="f-note" hidden></p>
  <p class="f-legal">Protected by reCAPTCHA. Google <a href="https://policies.google.com/privacy" rel="noopener" target="_blank">Privacy Policy</a> and <a href="https://policies.google.com/terms" rel="noopener" target="_blank">Terms of Service</a> apply.</p>
  <p class="f-ok" hidden>Sent. We read everything, and we'll reply.</p>
</form>
